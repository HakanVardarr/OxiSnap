[package]
name = "oxisnap-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
